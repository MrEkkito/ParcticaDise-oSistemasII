<!doctype html>
<html lang="es" data-theme="corporate">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Práctica de Diseño de Sistemas II">
  <title>Práctica de Diseño de Sistemas II</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-base-200 text-base-content">
  <main class="min-h-screen">
    <section id="welcome" class="min-h-screen grid place-items-center p-4 sm:p-6">
      <div class="card w-full max-w-2xl bg-base-100 shadow-xl border border-base-300">
        <div class="card-body gap-6 p-6 sm:p-10">
          <div>
            <span class="badge badge-primary badge-soft mb-4">Diseño de Sistemas II</span>
            <h1 class="card-title text-3xl sm:text-4xl font-bold">Práctica para el parcial</h1>
            <p class="mt-3 text-base-content/70">62 preguntas basadas en los materiales del curso.</p>
          </div>
          <div class="stats stats-vertical sm:stats-horizontal border border-base-300 shadow-none">
            <div class="stat py-4">
              <div class="stat-title">Preguntas</div>
              <div class="stat-value text-primary text-3xl">62</div>
            </div>
            <div class="stat py-4">
              <div class="stat-title">Temas</div>
              <div class="stat-value text-secondary text-3xl">6</div>
            </div>
          </div>
          <button id="startBtn" class="btn btn-primary btn-lg w-full sm:w-auto sm:self-start">
            Comenzar
            <span aria-hidden="true">→</span>
          </button>
        </div>
      </div>
    </section>

    <section id="quiz" class="hidden min-h-screen p-3 sm:p-6 lg:p-10">
      <div class="mx-auto w-full max-w-4xl">
        <header class="navbar min-h-0 rounded-box bg-base-100 border border-base-300 shadow-sm px-4 py-3 mb-4 sm:mb-6">
          <div class="flex-1 min-w-0">
            <div>
              <p class="font-bold truncate">Diseño de Sistemas II</p>
              <span id="counter" class="text-sm text-base-content/60"></span>
            </div>
          </div>
          <div class="w-28 sm:w-48">
            <progress id="progress" class="progress progress-primary w-full" value="1" max="62"></progress>
          </div>
        </header>

        <article class="card bg-base-100 border border-base-300 shadow-xl overflow-hidden">
          <div class="card-body p-5 sm:p-8 lg:p-10">
            <div><span id="topic" class="badge badge-secondary badge-outline"></span></div>
            <h2 id="questionText" class="text-xl sm:text-2xl lg:text-3xl font-bold leading-snug break-words"></h2>
            <div class="divider my-0"></div>
            <div id="answerArea" class="min-w-0"></div>
            <div id="feedback" class="hidden alert" role="status" aria-live="polite"></div>
            <div class="card-actions grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
              <button id="backBtn" class="btn btn-outline w-full sm:order-1">← Anterior</button>
              <button id="reviewBtn" class="btn btn-primary w-full sm:order-2">Revisar respuesta</button>
            </div>
          </div>
        </article>
      </div>
    </section>

    <section id="results" class="hidden min-h-screen grid place-items-center p-4 sm:p-6">
      <div class="card w-full max-w-xl bg-base-100 border border-base-300 shadow-xl">
        <div class="card-body items-center text-center gap-5 p-6 sm:p-10">
          <div class="radial-progress text-primary" id="scoreCircle" style="--value:0; --size:8rem; --thickness:.65rem" role="progressbar">0%</div>
          <div>
            <h1 class="text-3xl font-bold">Práctica terminada</h1>
            <p id="scoreText" class="mt-2 text-base-content/70"></p>
          </div>
          <div id="breakdown" class="w-full"></div>
          <button id="restartBtn" class="btn btn-primary w-full sm:w-auto">Volver a comenzar</button>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
